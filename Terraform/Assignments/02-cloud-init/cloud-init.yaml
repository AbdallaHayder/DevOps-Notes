#cloud-config
package_update: true

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html>
        <head>
          <title>Cloud-Init Lab</title>
        </head>
        <body>
          <h1>Hello from Abdalla's EC2 instance!</h1>
          <p>This page was created automatically by cloud-init.</p>
        </body>
      </html>

runcmd:
  - [systemctl, enable, --now, nginx]